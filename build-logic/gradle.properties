android.builtInKotlin=true
android.newDsl=true

# build-logic is an included build and has its own Gradle properties. Compile its
# small Kotlin plugin project in the current Gradle process instead of relying on
# a second JVM and the Kotlin daemon's local socket connection. This avoids the
# recurring "Could not connect to Kotlin compile daemon" failure during
# :build-logic:plugins:compileKotlin while leaving the main build's compiler
# execution strategy unchanged.
kotlin.compiler.execution.strategy=in-process
