# RED Sovereign Server Security Config
server.port=8443
server.ssl.key-store=classpath:red-keystore.p12
server.ssl.key-store-password=red-secret-password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=red-server

# Force local-only connections
server.address=0.0.0.0
spring.data.redis.host=cache-redis
spring.data.mongodb.host=db-mongo
spring.datasource.url=jdbc:postgresql://db-postgres:5432/red_sovereign
