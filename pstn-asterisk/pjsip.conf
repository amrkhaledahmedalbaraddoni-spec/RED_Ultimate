[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; ---- Trunk to the physical Dumin/GSM gateway (System B) ----
[dumin-trunk]
type=registration
transport=transport-udp
outbound_auth=dumin-auth
server_uri=sip:192.168.1.100:5060
client_uri=sip:red@192.168.1.100:5060
retry_interval=60

[dumin-auth]
type=auth
auth_type=userpass
username=red
password=red_secret_123

[dumin-trunk-endpoint]
type=endpoint
context=from-pstn
disallow=all
allow=opus
allow=ulaw
allow=alaw
outbound_auth=dumin-auth
aors=dumin-trunk-aor

[dumin-trunk-aor]
type=aor
contact=sip:192.168.1.100:5060

; ---- WebRTC client endpoint (app users) ----
[webrtc-client]
type=endpoint
context=from-internal
disallow=all
allow=opus
allow=vp8
transport=transport-ws
webrtc=yes
aors=webrtc-client-aor

[webrtc-client-aor]
type=aor
max_contacts=5
