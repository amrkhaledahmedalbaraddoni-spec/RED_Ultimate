[from-internal]
; Route calls to Dumin Gateway (System B)
exten => _X., 1, NoOp(PSTN Call to ${EXTEN} via Dumin)
same => n, Dial(PJSIP/${EXTEN}@dumin-trunk)
same => n, Hangup()

[from-pstn]
; Route incoming Dumin calls to the App (System B)
exten => s, 1, NoOp(Incoming GSM Call from Dumin)
same => n, Dial(PJSIP/webrtc-client)
same => n, Hangup()
