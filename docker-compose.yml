version: '3.8'

services:
  # 1. Core: Spring Boot relay & delivery server (System C + auth + signaling relay)
  backend:
    build: ./backend-server
    container_name: red-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-postgres:5432/red_sovereign
      - SPRING_DATASOURCE_USERNAME=red
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_MONGODB_URI=mongodb://db-mongo:27017/red_messages
      - SPRING_DATA_REDIS_HOST=cache-redis
      - RED_JWT_SECRET=${RED_JWT_SECRET:-please-change-this-long-random-sovereign-secret-32b}
      - RED_BOOTSTRAP_ADMIN_EMAIL=${RED_ADMIN_EMAIL:-admin@red.local}
      - RED_BOOTSTRAP_ADMIN_PASSWORD=${RED_ADMIN_PASSWORD:-changeme123}
      - RED_STORAGE_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=redadmin
      - MINIO_ROOT_PASSWORD=redsecret123
      - RED_DUMIN_BASE_URL=http://192.168.1.100:5060
    depends_on:
      db-postgres: { condition: service_healthy }
      db-mongo: { condition: service_healthy }
      cache-redis: { condition: service_healthy }
    networks: [red-net]

  # 2. Media SFU: Mediasoup worker for 4K VoIP (System A)
  media-sfu:
    build: ./media-sfu
    container_name: red-media-sfu
    environment:
      - PORT=4000
      - ANNOUNCED_IP=${PUBLIC_IP:-127.0.0.1}
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
    networks: [red-net]

  # 3. Relay: COTURN for external NAT traversal
  coturn:
    image: coturn/coturn
    container_name: red-turn
    restart: always
    ports: ["3478:3478", "3478:3478/udp"]
    environment:
      - REALM=red.sovereign
      - SECRET=${TURN_SECRET:-redturnsecret}
    networks: [red-net]

  # 4. PSTN gateway: Asterisk for Dumin/GSM (System B)
  pstn-gateway:
    image: andrius/asterisk
    container_name: red-pstn-gateway
    restart: always
    volumes: ["./pstn-asterisk:/etc/asterisk:ro"]
    ports: ["5060:5060/udp", "5038:5038", "8088:8088"]
    networks: [red-net]

  # 5. PostgreSQL (users / metadata)
  db-postgres:
    image: postgres:16
    container_name: red-db-sql
    restart: always
    environment:
      - POSTGRES_DB=red_sovereign
      - POSTGRES_USER=red
      - POSTGRES_PASSWORD=password
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "red"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [red-net]

  # 6. MongoDB (encrypted messages / stories)
  db-mongo:
    image: mongo:8
    container_name: red-db-nosql
    restart: always
    volumes: ["mongo-data:/data/db"]
    healthcheck: { test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [red-net]

  # 7. Redis (dedup, sequencing, presence, pub/sub)
  cache-redis:
    image: redis:7
    container_name: red-cache
    restart: always
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [red-net]

  # 8. Object storage (MinIO, S3-compatible)
  minio:
    image: minio/minio
    container_name: red-storage
    restart: always
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      - MINIO_ROOT_USER=redadmin
      - MINIO_ROOT_PASSWORD=redsecret123
    volumes: ["minio-data:/data"]
    networks: [red-net]

  # 9. Admin dashboard (React)
  admin-panel:
    build: ./admin_dashboard
    container_name: red-admin-ui
    restart: always
    networks: [red-net]

  # 10. Reverse proxy (Nginx) — single entry on :80
  nginx:
    image: nginx:alpine
    container_name: red-proxy
    restart: always
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend, admin-panel]
    networks: [red-net]

volumes:
  pg-data:
  mongo-data:
  minio-data:

networks:
  red-net:
    driver: bridge
