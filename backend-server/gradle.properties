# backend-server is an included (composite) build, so it has its own Gradle
# properties. The root build's verification metadata does not cover this build's
# Spring/Kotlin plugin classpath, so run it in lenient verification mode instead
# of failing the whole root build during configuration.
org.gradle.dependency.verification=lenient

# Keep every Gradle/Kotlin process on an ASCII-compatible locale. This is
# especially important on Windows systems configured with Arabic-Indic digit
# formatting, which corrupts generated resource directory names and Wire output.
org.gradle.jvmargs=-Xmx2g -Xms256m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
systemProp.user.language=en
systemProp.user.country=US
systemProp.file.encoding=UTF-8
